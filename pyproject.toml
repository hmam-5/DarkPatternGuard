[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkpatternguard"
version = "0.1.0"
description = "Detection of dark patterns in e-commerce text."
requires-python = "==3.11.*"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "scikit-learn==1.5.2",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "optuna==4.1.0",
    "lightgbm==4.5.0",
    "openai==1.54.4",
    "python-dotenv==1.0.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
    "fastapi==0.115.5",
    "uvicorn==0.32.0",
    "sqlalchemy==2.0.36",
    "pydantic-settings==2.6.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
